name: Kernel build environment

on:
  push:
    branches: ["main", "dev/**", "feature/**"]
    paths:
      - "containers/**"
      - "kernel-source.toml"
      - ".github/workflows/kernel-build-environment.yml"
  pull_request:
    paths:
      - "containers/**"
      - "kernel-source.toml"
      - ".github/workflows/kernel-build-environment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and inspect pinned environment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build pinned container
        run: docker build --platform linux/amd64 --pull --file containers/kernel-build.Dockerfile --tag bkernel-kernel-build:ci .

      - name: Verify deterministic environment and capture package inventory
        run: |
          docker run --rm bkernel-kernel-build:ci sh -ec '
            test "$LC_ALL" = C
            test "$LANG" = C
            test "$TZ" = UTC
            test "$SOURCE_DATE_EPOCH" = 1794335460
            test "$KBUILD_BUILD_USER" = bkernel
            test "$KBUILD_BUILD_HOST" = reproducible
            gcc --version
            clang --version
            make --version
            rustc --version
            cargo --version
            dpkg-query -W -f="${Package}=${Version}\n" | sort
          ' | tee kernel-build-packages.txt
          test -s kernel-build-packages.txt
          sha256sum kernel-build-packages.txt
