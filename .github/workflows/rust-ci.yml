name: Rust CI

on:
  push:
    branches: ["main", "dev/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint and test (Rust 1.85.1)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo +1.85.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.85.1 test --workspace --locked

      - name: Check dependency lockfile
        run: cargo +1.85.1 metadata --format-version 1 --locked --no-deps > /dev/null
