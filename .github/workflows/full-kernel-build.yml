name: Full Linux kernel build

on:
  push:
    branches: ["main", "ci/**"]
    paths:
      - "kernel-source.toml"
      - "containers/kernel-build.Dockerfile"
      - ".github/workflows/full-kernel-build.yml"
  pull_request:
    paths:
      - "kernel-source.toml"
      - "containers/kernel-build.Dockerfile"
      - ".github/workflows/full-kernel-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x86_64 kernel with Rust enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build pinned kernel toolchain
        run: docker build --platform linux/amd64 --pull --file containers/kernel-build.Dockerfile --tag bkernel-kernel-build:ci .

      - name: Download, verify and extract pinned Linux source
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -ec '
            eval "$(python3 - <<'"'"'PY'"'"'
import pathlib, shlex, tomllib
data = tomllib.loads(pathlib.Path("kernel-source.toml").read_text())
for key in ("version", "url", "sha256", "archive", "top_dir"):
    print(f"{key.upper()}={shlex.quote(str(data[key]))}")
PY
)"
            curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
            printf "%s  %s\n" "$SHA256" "$ARCHIVE" | sha256sum --check --strict
            mkdir -p /work/.kernel-source
            tar -xf "$ARCHIVE" --directory /work/.kernel-source
            test -f "/work/.kernel-source/$TOP_DIR/Makefile"
            printf "Verified and extracted Linux %s\n" "$VERSION"
          '

      - name: Configure and compile kernel with Rust
        run: |
          docker run --rm --volume "${{ github.workspace }}/.kernel-source:/src" --workdir /src/linux-7.3.4 bkernel-kernel-build:ci sh -ec '
            make LLVM=1 rustavailable
            make LLVM=1 x86_64_defconfig
            scripts/config --enable RUST
            make LLVM=1 olddefconfig
            grep -q "^CONFIG_RUST=y$" .config
            grep -q "^CONFIG_64BIT=y$" .config
            grep -q "^CONFIG_X86_64=y$" .config
            make LLVM=1 -j2 bzImage modules
            test -s arch/x86/boot/bzImage
            printf "Built Linux 7.3.4 x86_64 bzImage and modules with Rust enabled\n"
          '
