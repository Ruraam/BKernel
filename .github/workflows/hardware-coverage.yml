name: Hardware subsystem coverage

on:
  push:
    branches: ["main", "ci/**", "feat/**"]
    paths:
      - "kernel-source.toml"
      - "zen-source.toml"
      - "scripts/validate-zen-lock.py"
      - "containers/kernel-build.Dockerfile"
      - "scripts/validate-hardware-coverage.py"
      - "scripts/validate-nvidia-profile.py"
      - "scripts/validate-nvidia-lock.py"
      - "scripts/validate-nvidia-patches.py"
      - "drivers/nvidia/patches.lock"
      - "drivers/nvidia/version.lock"
      - "configs/x86_64/bubbleos-desktop.config"
      - "configs/x86_64/nvidia-pascal.config"
      - ".github/workflows/hardware-coverage.yml"
  pull_request:
    paths:
      - "kernel-source.toml"
      - "zen-source.toml"
      - "scripts/validate-zen-lock.py"
      - "containers/kernel-build.Dockerfile"
      - "scripts/validate-hardware-coverage.py"
      - "scripts/validate-nvidia-profile.py"
      - "scripts/validate-nvidia-lock.py"
      - "scripts/validate-nvidia-patches.py"
      - "drivers/nvidia/patches.lock"
      - "drivers/nvidia/version.lock"
      - "configs/x86_64/bubbleos-desktop.config"
      - "configs/x86_64/nvidia-pascal.config"
      - ".github/workflows/hardware-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Validate x86_64 driver subsystem configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate pinned NVIDIA driver metadata
        run: python3 scripts/validate-nvidia-lock.py

      - name: Validate pinned CachyOS NVIDIA patches
        run: python3 scripts/validate-nvidia-patches.py

      - name: Validate pinned Zen Kernel release metadata
        run: python3 scripts/validate-zen-lock.py

      - name: Build pinned kernel toolchain
        run: docker build --platform linux/amd64 --pull --file containers/kernel-build.Dockerfile --tag bkernel-kernel-build:ci .

      - name: Download, verify and extract pinned Linux source
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -ec '
            eval "$(python3 - <<'"'"'PY'"'"'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("kernel-source.toml").read_text())
          for key in ("version", "url", "sha256", "archive", "top_dir"):
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
            curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
            printf "%s  %s\\n" "$SHA256" "$ARCHIVE" | sha256sum --check --strict
            mkdir -p /work/.kernel-source
            tar -xf "$ARCHIVE" --directory /work/.kernel-source
            test -f "/work/.kernel-source/$TOP_DIR/Makefile"
            printf "Verified Linux %s source archive\\n" "$VERSION"
          '

      - name: Download, verify and apply pinned Zen patch
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -ec '
            eval "$(python3 - <<'"'"'PY'"'"'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("zen-source.toml").read_text())
          for key in ("version", "patch", "patch_url", "patch_sha256", "signature", "signature_url", "signature_sha256", "base_version"):
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
            curl --fail --location --retry 3 --output "$PATCH" "$PATCH_URL"
            curl --fail --location --retry 3 --output "$SIGNATURE" "$SIGNATURE_URL"
            printf "%s  %s\\n" "$PATCH_SHA256" "$PATCH" | sha256sum --check --strict
            printf "%s  %s\\n" "$SIGNATURE_SHA256" "$SIGNATURE" | sha256sum --check --strict
            zstd --decompress --stdout "$PATCH" > /work/zen.patch
            test -s /work/zen.patch
            cd "/work/.kernel-source/linux-$BASE_VERSION"
            patch --dry-run --batch --forward -p1 < /work/zen.patch
            patch --batch --forward -p1 < /work/zen.patch
            printf "Applied verified Zen patch %s\\n" "$VERSION"
          '

      - name: Generate allmodconfig and audit hardware subsystems
        run: |
          mkdir -p build-evidence
          TOP_DIR="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("kernel-source.toml").read_text())["top_dir"])')"
          eval "$(python3 - <<'PY'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("drivers/nvidia/version.lock").read_text())
          for key in ("version", "package", "url", "sha256"):
              print(f"NVIDIA_{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
          test -n "$TOP_DIR"
          docker run --rm --user 0:0 \
            --env "NVIDIA_VERSION=$NVIDIA_VERSION" \
            --env "NVIDIA_PACKAGE=$NVIDIA_PACKAGE" \
            --env "NVIDIA_URL=$NVIDIA_URL" \
            --env "NVIDIA_SHA256=$NVIDIA_SHA256" \
            --env "TOP_DIR=$TOP_DIR" \
            --volume "${{ github.workspace }}:/work" --workdir "/work/.kernel-source/$TOP_DIR" bkernel-kernel-build:ci sh -ec '
            KERNEL_BUILD_DIR="/work/.kernel-source/$TOP_DIR"
            KERNEL_BUILD_DIR="$(readlink -f "$KERNEL_BUILD_DIR")"
            printf "Kernel source directory: <%s>\\n" "$KERNEL_BUILD_DIR"
            test -f "$KERNEL_BUILD_DIR/Makefile"
            make LLVM=1 ARCH=x86_64 allmodconfig
            python3 /work/scripts/validate-hardware-coverage.py .config --report /work/build-evidence/hardware-coverage.txt
            cp .config /work/build-evidence/allmodconfig.config

            # Validate the Pascal/Nouveau profile separately from allmodconfig.
            make LLVM=1 rustavailable
            make LLVM=1 ARCH=x86_64 x86_64_defconfig
            scripts/kconfig/merge_config.sh -m .config \
              /work/configs/x86_64/bubbleos-desktop.config \
              /work/configs/x86_64/nvidia-pascal.config
            make LLVM=1 ARCH=x86_64 olddefconfig
            grep -qx '"'"'CONFIG_RUST=y'"'"' .config
            python3 /work/scripts/validate-nvidia-profile.py .config
            make LLVM=1 ARCH=x86_64 modules_prepare

            # Compile the complete kernel image and all configured modules.
            make LLVM=1 ARCH=x86_64 -j2 bzImage modules
            test -s arch/x86/boot/bzImage
            test -s vmlinux

            # Preserve the Nouveau object as explicit fallback-driver evidence.
            test -s drivers/gpu/drm/nouveau/nouveau.o
            cp .config /work/build-evidence/nvidia-pascal.config
            cp arch/x86/boot/bzImage /work/build-evidence/bzImage
            cp vmlinux /work/build-evidence/vmlinux
            cp System.map /work/build-evidence/System.map
            cp drivers/gpu/drm/nouveau/nouveau.o /work/build-evidence/
            make LLVM=1 ARCH=x86_64 modules_install INSTALL_MOD_PATH=/work/build-evidence/modules

            # Derive the release from the modules_install output. This is the
            # release Kbuild actually installed for this exact compiled tree.
            set -- /work/build-evidence/modules/lib/modules/*
            test "$#" -eq 1
            test -d "$1"
            KERNEL_RELEASE="${1##*/}"
            test "$KERNEL_RELEASE" = "7.3.4-zen2"
            printf "Verified installed kernel release: <%s>\\n" "$KERNEL_RELEASE"

            # Compile NVIDIA's proprietary Pascal modules against this exact build.
            NVIDIA_WORK=/tmp/bkernel-nvidia-build
            mkdir -p "$NVIDIA_WORK"
            curl --fail --location --retry 3 --output "$NVIDIA_WORK/$NVIDIA_PACKAGE" "$NVIDIA_URL"
            printf "%s  %s\\n" "$NVIDIA_SHA256" "$NVIDIA_WORK/$NVIDIA_PACKAGE" | sha256sum --check --strict
            sh "$NVIDIA_WORK/$NVIDIA_PACKAGE" --check
            (
              cd "$NVIDIA_WORK"
              sh "./$NVIDIA_PACKAGE" --extract-only
            )
            NVIDIA_SOURCE="$NVIDIA_WORK/NVIDIA-Linux-x86_64-$NVIDIA_VERSION"
            printf "NVIDIA extraction directory: <%s>\\n" "$NVIDIA_SOURCE"
            if [ ! -f "$NVIDIA_SOURCE/kernel/Makefile" ]; then
              printf "ERROR: NVIDIA kernel Makefile missing. Extracted directory contents:\\n"
              find "$NVIDIA_WORK" -maxdepth 3 -type f -name Makefile -print | head -50
              exit 1
            fi
            printf "NVIDIA kernel Makefile found.\\n"
 
            # Apply the reviewed CachyOS Pascal/580 patches to the extracted
            # proprietary driver, never to the Linux kernel source tree.
            PATCH_WORK=/tmp/bkernel-nvidia-patches
            mkdir -p "$PATCH_WORK"
            python3 - <<'PY' > "$PATCH_WORK/manifest"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("/work/drivers/nvidia/patches.lock").read_text())
          for patch in data["patches"]:
              print(data["source_repository"], data["source_commit"], data["target_subdirectory"], patch["name"], patch["path"], patch["blob_sha1"])
          PY
            while read -r patch_repository patch_commit patch_target patch_name patch_path patch_blob_sha1; do
              patch_file="$PATCH_WORK/$patch_name.patch"
              patch_url="https://raw.githubusercontent.com/$patch_repository/$patch_commit/$patch_path"
              curl --fail --location --retry 3 --output "$patch_file" "$patch_url"
              actual_blob_sha1="$(git hash-object "$patch_file")"
              if [ "$actual_blob_sha1" != "$patch_blob_sha1" ]; then
                printf "ERROR: CachyOS patch blob mismatch for %s: expected <%s>, got <%s>\\n" "$patch_name" "$patch_blob_sha1" "$actual_blob_sha1"
                exit 1
              fi
              printf "Verified CachyOS patch: %s (%s)\\n" "$patch_name" "$actual_blob_sha1"
            done < "$PATCH_WORK/manifest"
            while read -r patch_repository patch_commit patch_target patch_name patch_path patch_blob_sha1; do
              patch --dry-run --batch --forward -Np1 -d "$NVIDIA_SOURCE/$patch_target" < "$PATCH_WORK/$patch_name.patch"
            done < "$PATCH_WORK/manifest"
            while read -r patch_repository patch_commit patch_target patch_name patch_path patch_blob_sha1; do
              patch --batch --forward -Np1 -d "$NVIDIA_SOURCE/kernel" < "$PATCH_WORK/$patch_name.patch"
              printf "Applied CachyOS patch: %s\\n" "$patch_name"
            done < "$PATCH_WORK/manifest"

            # Keep the canonical source path resolved and validated before
            # compilation. Do not replace it with pwd: the current directory
            # may no longer resolve to the mounted source tree after extraction.
            if [ -z "$KERNEL_BUILD_DIR" ] || [ ! -f "$KERNEL_BUILD_DIR/Makefile" ]; then
              printf "ERROR: kernel source path invalid: <%s> (TOP_DIR=<%s>)\\n" "$KERNEL_BUILD_DIR" "$TOP_DIR"
              ls -ld "/work/.kernel-source" "/work/.kernel-source/$TOP_DIR" 2>&1 || true
              exit 1
            fi
            if [ "$KERNEL_RELEASE" != "7.3.4-zen2" ]; then
              printf "ERROR: unexpected installed kernel release: <%s>\\n" "$KERNEL_RELEASE"
              exit 1
            fi
            test -n "$KERNEL_BUILD_DIR"
            test -n "$KERNEL_RELEASE"
            printf "Verified NVIDIA build inputs: source=<%s> release=<%s>\\n" "$KERNEL_BUILD_DIR" "$KERNEL_RELEASE"
            printf "NVIDIA build target: kernel_dir=<%s> kernel_release=<%s>\\n" "$KERNEL_BUILD_DIR" "$KERNEL_RELEASE"
            mkdir -p "/lib/modules/$KERNEL_RELEASE"
            ln -sfn "$KERNEL_BUILD_DIR" "/lib/modules/$KERNEL_RELEASE/build"
            ln -sfn "$KERNEL_BUILD_DIR" "/lib/modules/$KERNEL_RELEASE/source"
            {
              printf "Driver: %s\\nKernel: %s\\n" "$NVIDIA_VERSION" "$KERNEL_RELEASE"
              printf "Compiler: %s\\n" "$(clang --version | head -n 1)"
            } > /work/build-evidence/nvidia-build-environment.txt
            if ! make -C "$NVIDIA_SOURCE/kernel" KERNEL_UNAME="$KERNEL_RELEASE" SYSSRC="$KERNEL_BUILD_DIR" SYSOUT="$KERNEL_BUILD_DIR" LLVM=1 CC=clang LD=ld.lld -j2 > /work/build-evidence/nvidia-build.log 2>&1; then
              cat /work/build-evidence/nvidia-build.log
              exit 1
            fi
            cat /work/build-evidence/nvidia-build.log

            find "$NVIDIA_SOURCE/kernel" -maxdepth 1 -type f -name '"'"'*.ko'"'"' -printf '"'"'%f\\n'"'"' | sort > /work/build-evidence/nvidia-modules.txt
            grep -qx '"'"'nvidia.ko'"'"' /work/build-evidence/nvidia-modules.txt
            grep -qx '"'"'nvidia-modeset.ko'"'"' /work/build-evidence/nvidia-modules.txt
            grep -qx '"'"'nvidia-uvm.ko'"'"' /work/build-evidence/nvidia-modules.txt
            grep -qx '"'"'nvidia-drm.ko'"'"' /work/build-evidence/nvidia-modules.txt
            sha256sum "$NVIDIA_SOURCE"/kernel/*.ko > /work/build-evidence/nvidia-modules.SHA256SUMS
            rm -rf "$NVIDIA_WORK"
            sha256sum /work/build-evidence/nvidia-pascal.config /work/build-evidence/bzImage /work/build-evidence/vmlinux /work/build-evidence/System.map /work/build-evidence/nouveau.o > /work/build-evidence/kernel.SHA256SUMS
          '

      - name: Upload hardware coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bkernel-linux-7.3.4-zen2-x86_64-hardware-coverage
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
