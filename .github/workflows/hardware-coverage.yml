name: Hardware subsystem coverage

on:
  push:
    branches: ["main", "ci/**", "feat/**"]
    paths:
      - "kernel-source.toml"
      - "zen-source.toml"
      - "scripts/validate-zen-lock.py"
      - "containers/kernel-build.Dockerfile"
      - "scripts/validate-hardware-coverage.py"
      - "scripts/validate-nvidia-profile.py"
      - "scripts/validate-nvidia-lock.py"
      - "scripts/validate-nvidia-patches.py"
      - "scripts/ci/build-nvidia-evidence.sh"
      - "scripts/ci/package-kernel-devel.sh"
      - "scripts/ci/package-kernel-devel-deb.sh"
      - "drivers/nvidia/patches.lock"
      - "drivers/nvidia/version.lock"
      - "configs/x86_64/bubbleos-desktop.config"
      - "configs/x86_64/nvidia-pascal.config"
      - ".github/workflows/hardware-coverage.yml"
  pull_request:
    paths:
      - "kernel-source.toml"
      - "zen-source.toml"
      - "scripts/validate-zen-lock.py"
      - "containers/kernel-build.Dockerfile"
      - "scripts/validate-hardware-coverage.py"
      - "scripts/validate-nvidia-profile.py"
      - "scripts/validate-nvidia-lock.py"
      - "scripts/validate-nvidia-patches.py"
      - "scripts/ci/build-nvidia-evidence.sh"
      - "scripts/ci/package-kernel-devel.sh"
      - "scripts/ci/package-kernel-devel-deb.sh"
      - "drivers/nvidia/patches.lock"
      - "drivers/nvidia/version.lock"
      - "configs/x86_64/bubbleos-desktop.config"
      - "configs/x86_64/nvidia-pascal.config"
      - ".github/workflows/hardware-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Validate x86_64 driver subsystem configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate pinned NVIDIA driver metadata
        run: python3 scripts/validate-nvidia-lock.py

      - name: Validate pinned CachyOS NVIDIA patches
        run: python3 scripts/validate-nvidia-patches.py

      - name: Validate pinned Zen Kernel release metadata
        run: python3 scripts/validate-zen-lock.py

      - name: Build pinned kernel toolchain
        run: docker build --platform linux/amd64 --pull --file containers/kernel-build.Dockerfile --tag bkernel-kernel-build:ci .

      - name: Download, verify and extract pinned Linux source
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -xec '
            eval "$(python3 - <<'"'"'PY'"'"'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("kernel-source.toml").read_text())
          for key in ("version", "url", "sha256", "archive", "top_dir"):
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
            curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
            printf "%s  %s\\n" "$SHA256" "$ARCHIVE" | sha256sum --check --strict
            mkdir -p /work/.kernel-source
            tar -xf "$ARCHIVE" --directory /work/.kernel-source
            test -f "/work/.kernel-source/$TOP_DIR/Makefile"
            printf "Verified Linux %s source archive\\n" "$VERSION"
          '

      - name: Download, verify and apply pinned Zen patch
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -ec '
            eval "$(python3 - <<'"'"'PY'"'"'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("zen-source.toml").read_text())
          for key in ("version", "patch", "patch_url", "patch_sha256", "signature", "signature_url", "signature_sha256", "base_version"):
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
            curl --fail --location --retry 3 --output "$PATCH" "$PATCH_URL"
            curl --fail --location --retry 3 --output "$SIGNATURE" "$SIGNATURE_URL"
            printf "%s  %s\\n" "$PATCH_SHA256" "$PATCH" | sha256sum --check --strict
            printf "%s  %s\\n" "$SIGNATURE_SHA256" "$SIGNATURE" | sha256sum --check --strict
            zstd --decompress --stdout "$PATCH" > /work/zen.patch
            test -s /work/zen.patch
            cd "/work/.kernel-source/linux-$BASE_VERSION"
            patch --dry-run --batch --forward -p1 < /work/zen.patch
            patch --batch --forward -p1 < /work/zen.patch
            printf "Applied verified Zen patch %s\\n" "$VERSION"
          '

      - name: Generate allmodconfig and audit hardware subsystems
        run: |
          mkdir -p build-evidence
          # Build the patch manifest on the runner, then pass it through the
          # already-mounted build-evidence directory into the build container.
          python3 - <<'PY' > build-evidence/nvidia-patches.manifest
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("drivers/nvidia/patches.lock").read_text())
          for patch in data["patches"]:
              print(data["source_repository"], data["source_commit"], data["target_subdirectory"], patch["name"], patch["path"], patch["blob_sha1"])
          PY
          test -s build-evidence/nvidia-patches.manifest
          printf "\\n===== RUNNER workspace diagnostics =====\\n"
          printf "GITHUB_WORKSPACE=<%s>\\n" "$GITHUB_WORKSPACE"
          printf "runner cwd: "; pwd -P
          stat -c "%d:%i %A %U:%G %s bytes %n" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-evidence" "$GITHUB_WORKSPACE/build-evidence/nvidia-patches.manifest"
          printf "runner mount: "; findmnt -T "$GITHUB_WORKSPACE" 2>&1 || true
          printf "runner filesystem: "; df -hT "$GITHUB_WORKSPACE" 2>&1 || true
          printf "runner inodes: "; df -i "$GITHUB_WORKSPACE" 2>&1 || true
          printf "runner manifest SHA256: "; sha256sum build-evidence/nvidia-patches.manifest
          printf "runner manifest contents:\\n"; cat build-evidence/nvidia-patches.manifest
          printf "===== END RUNNER diagnostics =====\\n"
          TOP_DIR="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("kernel-source.toml").read_text())["top_dir"])')"
          eval "$(python3 - <<'PY'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("drivers/nvidia/version.lock").read_text())
          for key in ("version", "package", "url", "sha256"):
              print(f"NVIDIA_{key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
          test -n "$TOP_DIR"
          docker run --rm --user 0:0 \
            --env "NVIDIA_VERSION=$NVIDIA_VERSION" \
            --env "NVIDIA_PACKAGE=$NVIDIA_PACKAGE" \
            --env "NVIDIA_URL=$NVIDIA_URL" \
            --env "NVIDIA_SHA256=$NVIDIA_SHA256" \
            --env "TOP_DIR=$TOP_DIR" \
            --mount "type=bind,source=${{ github.workspace }},target=/bkernel" \
            --workdir "/bkernel/.kernel-source/$TOP_DIR" \
            bkernel-kernel-build:ci sh -ex /bkernel/scripts/ci/build-nvidia-evidence.sh
          test -s build-evidence/hardware-coverage.txt
          test -s build-evidence/nvidia-build.log
          test -s build-evidence/nvidia-modules.txt
          test -s build-evidence/nvidia-modules.SHA256SUMS
          test -s build-evidence/nvidia-build-evidence.SHA256SUMS
          test -s build-evidence/kernelrelease
          test -s build-evidence/nvidia-patches.manifest

      - name: Package kernel-devel and verify external-module build
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          TOP_DIR="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("kernel-source.toml").read_text())["top_dir"])')"
          docker run --rm --user 0:0 \
            --env "TOP_DIR=$TOP_DIR" \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            --mount "type=bind,source=${{ github.workspace }},target=/bkernel" \
            --workdir "/bkernel/.kernel-source/$TOP_DIR" \
            bkernel-kernel-build:ci sh /bkernel/scripts/ci/package-kernel-devel.sh
          test -s "build-evidence/kernel-devel/bkernel-kernel-devel-7.3.4-zen2-x86_64.tar.zst"
          test -s build-evidence/kernel-devel/SHA256SUMS

      - name: Build and verify removable Debian kernel-devel package
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          TOP_DIR="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("kernel-source.toml").read_text())["top_dir"])')"
          docker run --rm --user 0:0 \
            --env "TOP_DIR=$TOP_DIR" \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            --volume "${{ github.workspace }}:/bkernel" \
            --workdir /bkernel \
            bkernel-kernel-build:ci sh /bkernel/scripts/ci/package-kernel-devel-deb.sh
          test -s build-evidence/deb/bkernel-headers-7.3.4-zen2_7.3.4-zen2-1_amd64.deb
          test -s build-evidence/deb/SHA256SUMS
          docker run --rm --user 0:0 \
            --volume "${{ github.workspace }}:/bkernel:ro" \
            --workdir / \
            bkernel-kernel-build:ci sh -ec '
              package=bkernel-headers-7.3.4-zen2
              dpkg -i /bkernel/build-evidence/deb/bkernel-headers-7.3.4-zen2_7.3.4-zen2-1_amd64.deb
              dpkg-query -s "$package" | grep -F "Status: install ok installed"
              test -L /lib/modules/7.3.4-zen2/build
              test -L /lib/modules/7.3.4-zen2/source
              test -s /usr/src/bkernel-headers-7.3.4-zen2/linux-7.3.4/Module.symvers
              dpkg --remove "$package"
              test ! -e /usr/src/bkernel-headers-7.3.4-zen2
              test ! -L /lib/modules/7.3.4-zen2/build
              test ! -L /lib/modules/7.3.4-zen2/source
            '

      - name: Upload Debian kernel-devel package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bkernel-headers-7.3.4-zen2-amd64-deb
          path: build-evidence/deb/
          if-no-files-found: error
          retention-days: 30

      - name: Upload kernel-devel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bkernel-kernel-devel-7.3.4-zen2-x86_64
          path: build-evidence/kernel-devel/
          if-no-files-found: error
          retention-days: 30

      - name: Upload hardware coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bkernel-linux-7.3.4-zen2-x86_64-hardware-coverage
          path: |
            build-evidence/**
            !build-evidence/kernel-devel/**
          if-no-files-found: error
          retention-days: 14
