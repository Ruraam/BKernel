name: Kernel source and Rust validation

on:
  push:
    branches: ["main", "fix/**", "ci/**"]
    paths:
      - "kernel-source.toml"
      - "containers/kernel-build.Dockerfile"
      - ".github/workflows/kernel-source-validation.yml"
  pull_request:
    paths:
      - "kernel-source.toml"
      - "containers/kernel-build.Dockerfile"
      - ".github/workflows/kernel-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify Linux source and Rust Kbuild support
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build pinned kernel toolchain
        run: docker build --platform linux/amd64 --pull --file containers/kernel-build.Dockerfile --tag bkernel-kernel-build:ci .

      - name: Download and verify pinned Linux source
        run: |
          docker run --rm --volume "${{ github.workspace }}:/work" --workdir /work bkernel-kernel-build:ci sh -ec '
            eval "$(python3 - <<'"'"'PY'"'"'
          import pathlib, shlex, tomllib
          data = tomllib.loads(pathlib.Path("kernel-source.toml").read_text())
          for key in ("version", "url", "sha256", "archive", "top_dir"):
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          PY
)"
            curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
            printf "%s  %s\n" "$SHA256" "$ARCHIVE" | sha256sum --check --strict
            tar -tf "$ARCHIVE" | grep -m1 "^$TOP_DIR/Makefile$"
            mkdir -p /work/.kernel-source
            tar -xf "$ARCHIVE" --directory /work/.kernel-source
            test -f "/work/.kernel-source/$TOP_DIR/Makefile"
            printf "Verified Linux %s source archive\n" "$VERSION"
          '

      - name: Validate Rust support and baseline configuration
        run: |
          docker run --rm --volume "${{ github.workspace }}/.kernel-source:/src:ro" --workdir /src/linux-7.3.4 bkernel-kernel-build:ci sh -ec '
            make LLVM=1 rustavailable
            make LLVM=1 x86_64_defconfig
            make LLVM=1 olddefconfig
            grep -E "^(CONFIG_64BIT=y|CONFIG_X86_64=y)" .config
            printf "Rust Kbuild support and x86_64 baseline configuration validated\n"
          '
